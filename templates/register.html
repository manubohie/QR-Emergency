<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<div class="container">
    <div class="title">Crear Polsera</div>

    <form method="POST">

        <div class="field">
            <img src="/static/img/user.png">
            <input name="name" placeholder="Nom complet" required>
        </div>

        <div class="field">
            <img src="/static/img/car.png">
            <input name="vehicle" placeholder="Matrícula" required>
        </div>

        <div class="field">
            <img src="/static/img/user.png">
            <select name="gender">
                <option>Male</option>
                <option>Female</option>
            </select>
        </div>

        <div class="field">
            <img src="/static/img/phone.png">
            <input name="emergency_phone" placeholder="Telèfon d'emergència" required>
        </div>

        <div class="field">
            <img src="/static/img/phone.png">
            <input name="optional_phone" placeholder="Telèfon opcional">
        </div>

        <div class="field">
            <img src="/static/img/user.png">
            <input name="occupation" placeholder="Ocupació">
        </div>

        <div class="field">
            <img src="/static/img/address.png">
            <textarea name="address" placeholder="Adreça" required></textarea>
        </div>

        <div class="field">
            <img src="/static/img/blood.png">
            <input name="blood" placeholder="Grup sanguini">
        </div>

        <div class="field">
            <img src="/static/img/medical.png">
            <textarea name="medical" placeholder="Condicions mèdiques"></textarea>
        </div>

        <button type="submit">Generar QR</button>
    </form>

    <a class="back" href="/">Tornar</a>
</div>

</body>
</html>
