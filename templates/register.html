<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Registrar persona</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>

<body>
<div class="page-wrapper">

    <h1 class="title">Registrar persona</h1>

    <form method="POST">

        <div class="field-modern">
            <img src="/static/img/user.png" class="icon-field">
            <input type="text" name="nom" placeholder="Nom" required>
        </div>

        <div class="field-modern">
            <img src="/static/img/user.png" class="icon-field">
            <input type="text" name="primer_cognom" placeholder="Primer cognom" required>
        </div>

        <div class="field-modern">
            <img src="/static/img/user.png" class="icon-field">
            <input type="text" name="segon_cognom" placeholder="Segon cognom">
        </div>

        <div class="field-modern">
            <img src="/static/img/user.png" class="icon-field">
            <input type="number" name="edat" placeholder="Edat" required>
        </div>

        <div class="field-modern">
            <img src="/static/img/user.png" class="icon-field">
            <select name="genere">
                <option value="">Selecciona gènere</option>
                <option value="home">Home</option>
                <option value="dona">Dona</option>
            </select>
        </div>

        <div class="field-modern">
            <img src="/static/img/user.png" class="icon-field">

            <select id="familiars" name="familiars" multiple>
                {% for p in people %}
                    <option value="{{ p.id }}">
                        {{ p.nom }} {{ p.primer_cognom }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-modern">Registrar</button>
            <button href="/search" class="btn-modern">Cercar persona</a>
            <button href="/" class="btn-modern">Pàgina principal</a>
        </div>

    </form>

</div>

<script>
    const familiarsSelect = new Choices('#familiars', {
        removeItemButton: true,
        searchPlaceholderValue: 'Escriu un nom...',
        placeholderValue: 'Selecciona familiars',
        searchEnabled: true,
        itemSelectText: '',
    });
</script>

</body>
</html>
